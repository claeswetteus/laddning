<style>
:root{
  --bg:#f2f3f5; --card:#ffffff; --ink:#0d1117; --ink2:#59626e; --muted:#8a929c;
  --line:#e3e6ea; --accent:#0e9f6e; --accent-soft:#0e9f6e1f; --warn:#c2410c;
  --track:#e6e9ed; --ring:#0e9f6e40; color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0d10; --card:#16191e; --ink:#f3f5f7; --ink2:#a4acb6; --muted:#6f7883;
    --line:#262b32; --accent:#34d399; --accent-soft:#34d39922; --warn:#fb923c;
    --track:#262b32; --ring:#34d39940;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
  max-width:560px;margin:0 auto;-webkit-user-select:none;user-select:none;
}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:8px 4px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1 .gear{flex:none}
.gear{border:0;background:var(--card);color:var(--ink2);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px}
.label{font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}

/* Hero */
.hero{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .pct b{font-size:26px;font-weight:700;letter-spacing:-.02em;display:block}
.ring .pct small{font-size:12px;color:var(--muted)}
.dur{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.dur span{font-size:22px;font-weight:600;color:var(--ink2);margin:0 4px 0 2px}
.sub{color:var(--ink2);font-size:14px;margin-top:6px}

/* Sliders */
.slider-row{margin-top:4px}
.slider-row + .slider-row{margin-top:20px}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.step{display:flex;gap:8px;align-items:center}
.step button{border:0;background:var(--track);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:20px;font-weight:600;cursor:pointer}
.step button:active{transform:scale(.94)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--track) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* Times */
.times{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.times .card{margin:0}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.note{font-size:13px;color:var(--ink2);margin-top:4px}
.time-input{appearance:none;-webkit-appearance:none;border:0;background:var(--track);color:var(--ink);font:inherit;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;border-radius:12px;padding:6px 10px;margin-top:8px;width:100%;min-height:44px;text-align:left}
.warn{color:var(--warn)}
.accent{color:var(--accent)}

/* Chart */
.seg{display:flex;background:var(--track);border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#chart{position:relative;touch-action:pan-y}
#chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--card);font-size:13px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 0;text-transform:uppercase;letter-spacing:.04em}
td{padding:11px 0;border-top:1px solid var(--line);font-size:16px}
td:last-child,th:last-child{text-align:right}
td .bar{display:inline-block;height:6px;border-radius:6px;background:var(--accent);vertical-align:middle;margin-right:10px;opacity:.85}
tr.done td{font-weight:700;color:var(--accent)}

/* Settings sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .25s ease;z-index:10;max-width:560px;margin:0 auto}
.open .sheet-bg{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;margin:0 0 16px}
.field{margin-bottom:18px}
.field input{width:100%;border:0;background:var(--track);color:var(--ink);font:inherit;font-size:20px;font-weight:600;border-radius:12px;padding:10px 12px;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips button{border:0;background:var(--track);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--accent);color:#fff}
.done-btn{width:100%;border:0;background:var(--accent);color:#fff;font:inherit;font-size:17px;font-weight:600;padding:14px;border-radius:14px;cursor:pointer}
.meta{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}
</style>
</head>
<body>

<h1><span>Wetteus BMW i4</span>
  <button class="gear" id="openSettings" aria-label="Inställningar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</h1>

<!-- Hero: duration -->
<div class="card hero">
  <div class="ring">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="var(--track)" stroke-width="12"/>
      <circle id="ringTarget" cx="60" cy="60" r="52" fill="none" stroke="var(--ring)" stroke-width="12" stroke-linecap="round"/>
      <circle id="ringNow" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"/>
    </svg>
    <div class="pct"><div><b id="ringPct">12%</b><small id="ringTo">→ 100%</small></div></div>
  </div>
  <div>
    <div class="label">Laddtid</div>
    <div class="dur" id="dur">–</div>
    <div class="sub" id="durSub">–</div>
  </div>
</div>

<!-- Inputs -->
<div class="card">
  <div class="slider-row">
    <div class="slider-head">
      <div><div class="label">Nuvarande nivå</div><div class="val" id="curVal">12%</div></div>
      <div class="step"><button data-t="cur" data-d="-1" aria-label="Minska">−</button><button data-t="cur" data-d="1" aria-label="Öka">+</button></div>
    </div>
    <input type="range" id="cur" min="0" max="100" step="1" value="12">
  </div>
  <div class="slider-row">
    <div class="slider-head">
      <div><div class="label">Mål</div><div class="val" id="tgtVal">100%</div></div>
      <div class="step"><button data-t="tgt" data-d="-5" aria-label="Minska">−</button><button data-t="tgt" data-d="5" aria-label="Öka">+</button></div>
    </div>
    <input type="range" id="tgt" min="0" max="100" step="1" value="100">
  </div>
</div>

<!-- Times -->
<div class="times">
  <div class="card">
    <div class="label">Klar om start nu</div>
    <div class="big" id="readyNow">–</div>
    <div class="note" id="readyNowDay">–</div>
  </div>
  <div class="card">
    <div class="label">Klar kl (önskan)</div>
    <input type="time" class="time-input" id="wish" value="07:30">
    <div class="note" id="startAt">–</div>
  </div>
</div>

<!-- Chart -->
<div class="card" style="margin-top:14px">
  <div class="chart-head">
    <div class="label">Förlopp</div>
    <div class="seg" role="tablist">
      <button class="on" data-view="chart">Graf</button>
      <button data-view="table">Tabell</button>
    </div>
  </div>
  <div id="chart"><div class="tip" id="tip"></div></div>
  <div id="tableWrap" hidden></div>
</div>

<div class="meta" id="meta"></div>

<!-- Settings -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" role="dialog" aria-label="Inställningar">
  <div class="grab"></div>
  <h2>Inställningar</h2>
  <div class="field">
    <div class="label">Laddeffekt (kW)</div>
    <input type="number" id="kw" inputmode="decimal" step="0.1" min="0.5" value="3.3">
    <div class="chips" id="kwChips">
      <button data-kw="2.3">2,3</button><button data-kw="3.3">3,3</button><button data-kw="3.7">3,7</button><button data-kw="7.4">7,4</button><button data-kw="11">11</button>
    </div>
  </div>
  <div class="field">
    <div class="label">Batteri (kWh)</div>
    <input type="number" id="bat" inputmode="decimal" step="0.1" min="1" value="81.3">
  </div>
  <button class="done-btn" id="closeSettings">Klar</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'laddning.v1';
  const defaults = { cur: 12, tgt: 100, kw: 3.3, bat: 81.3, wish: '07:30', view: 'chart' };
  let s = { ...defaults };
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

  const pad = n => String(n).padStart(2, '0');
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const nf = new Intl.NumberFormat('sv-SE', { maximumFractionDigits: 1 });
  const dayWord = d => {
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const d0 = new Date(d); d0.setHours(0,0,0,0);
    const diff = Math.round((d0 - t0) / 864e5);
    if (diff === 0) return 'idag';
    if (diff === 1) return 'imorgon';
    if (diff === -1) return 'igår';
    return d.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'short' });
  };
  const fmtDur = h => {
    const total = Math.round(h * 60);
    return { h: Math.floor(total / 60), m: total % 60 };
  };

  // Rings
  const C = 2 * Math.PI * 52;
  const setRing = (el, from, to) => {
    const len = Math.max(0, to - from) / 100 * C;
    el.style.strokeDasharray = `${len} ${C}`;
    el.style.strokeDashoffset = -from / 100 * C;
  };

  function sync() {
    $('cur').value = s.cur; $('tgt').value = s.tgt;
    $('cur').style.setProperty('--p', s.cur + '%');
    $('tgt').style.setProperty('--p', s.tgt + '%');
    $('curVal').textContent = s.cur + '%';
    $('tgtVal').textContent = s.tgt + '%';
    $('kw').value = s.kw; $('bat').value = s.bat; $('wish').value = s.wish;
    document.querySelectorAll('#kwChips button').forEach(b => b.classList.toggle('on', +b.dataset.kw === +s.kw));
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.view === s.view));
    $('chart').hidden = s.view !== 'chart';
    $('tableWrap').hidden = s.view !== 'table';
  }

  function calc() {
    const kwh = Math.max(0, (s.tgt - s.cur) / 100 * s.bat);
    const hours = s.kw > 0 ? kwh / s.kw : 0;
    const pctPerHour = s.bat > 0 ? s.kw / s.bat * 100 : 0;
    return { kwh, hours, pctPerHour };
  }

  function render() {
    sync();
    const { kwh, hours, pctPerHour } = calc();
    const now = new Date();
    const d = fmtDur(hours);

    setRing($('ringNow'), 0, s.cur);
    setRing($('ringTarget'), s.cur, s.tgt);
    $('ringPct').textContent = s.cur + '%';
    $('ringTo').textContent = '→ ' + s.tgt + '%';

    if (hours <= 0) {
      $('dur').innerHTML = 'Klart';
      $('durSub').textContent = 'Redan på eller över målet';
      $('readyNow').textContent = '–'; $('readyNowDay').textContent = '';
      $('startAt').textContent = 'Ingen laddning behövs';
      drawChart(now, 0, pctPerHour); drawTable(now, 0, pctPerHour);
      return;
    }

    $('dur').innerHTML = `${d.h}<span>h</span>${pad(d.m)}<span>min</span>`;
    $('durSub').textContent = `${nf.format(kwh)} kWh · ${nf.format(pctPerHour)} %/h vid ${nf.format(s.kw)} kW`;

    const ready = new Date(now.getTime() + hours * 36e5);
    $('readyNow').textContent = hm(ready);
    $('readyNowDay').textContent = dayWord(ready);

    // Desired finish: next occurrence of the chosen time
    const [wh, wm] = (s.wish || '07:30').split(':').map(Number);
    const finish = new Date(now); finish.setHours(wh, wm, 0, 0);
    if (finish <= now) finish.setDate(finish.getDate() + 1);
    const start = new Date(finish.getTime() - hours * 36e5);
    if (start < now) {
      const lateMin = Math.round((ready - finish) / 6e4);
      const l = fmtDur(lateMin / 60);
      $('startAt').innerHTML = `<span class="warn">Hinner inte – ${l.h ? l.h + ' h ' : ''}${l.m} min sent</span>`;
    } else {
      $('startAt').innerHTML = `Börja ladda <b class="accent">${hm(start)}</b> ${dayWord(start)}`;
    }

    drawChart(now, hours, pctPerHour);
    drawTable(now, hours, pctPerHour);
  }

  // Hourly rows: now, every full hour step, and the finish point
  function points(now, hours, pph) {
    const pts = [{ t: now, p: s.cur }];
    for (let i = 1; i < hours; i++) pts.push({ t: new Date(now.getTime() + i * 36e5), p: s.cur + i * pph });
    if (hours > 0) pts.push({ t: new Date(now.getTime() + hours * 36e5), p: s.tgt, end: true });
    return pts;
  }

  function drawTable(now, hours, pph) {
    const pts = points(now, hours, pph);
    let h = '<table><thead><tr><th>Klockan</th><th>Tid</th><th>Nivå</th></tr></thead><tbody>';
    pts.forEach((pt) => {
      const el = (pt.t - now) / 36e5;
      const e = fmtDur(el);
      h += `<tr class="${pt.end ? 'done' : ''}"><td>${hm(pt.t)}</td><td>${el === 0 ? 'nu' : '+' + e.h + ':' + pad(e.m)}</td>` +
           `<td><span class="bar" style="width:${Math.round(pt.p * .6)}px"></span>${Math.round(pt.p)}%</td></tr>`;
    });
    $('tableWrap').innerHTML = h + '</tbody></table>';
  }

  let chartState = null;
  function drawChart(now, hours, pph) {
    const box = $('chart');
    const W = Math.max(280, box.clientWidth || 320), H = 200;
    const m = { l: 34, r: 12, t: 26, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const span = Math.max(hours, 1);
    const x = h => m.l + (h / span) * iw;
    const y = p => m.t + (1 - p / 100) * ih;

    let g = '';
    [0, 25, 50, 75, 100].forEach(p => {
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/>`;
      g += `<text x="${m.l - 8}" y="${y(p) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${p}%</text>`;
    });
    // time ticks
    const stepH = span <= 6 ? 1 : span <= 12 ? 2 : span <= 24 ? 4 : 6;
    for (let h = 0; h <= span + 1e-9; h += stepH) {
      const t = new Date(now.getTime() + h * 36e5);
      g += `<text x="${x(h)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${hm(t)}</text>`;
    }
    const x0 = x(0), x1 = x(hours), y0 = y(s.cur), y1 = y(s.tgt);
    const area = hours > 0
      ? `<path d="M${x0},${y(0)} L${x0},${y0} L${x1},${y1} L${x1},${y(0)} Z" fill="var(--accent-soft)"/>` +
        `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>` +
        `<line x1="${m.l}" x2="${W - m.r}" y1="${y1}" y2="${y1}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>` +
        `<circle cx="${x0}" cy="${y0}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>` +
        `<circle cx="${x1}" cy="${y1}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>` +
        `<text x="${Math.min(x1, W - m.r)}" y="${y1 - 10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${s.tgt}% kl ${hm(new Date(now.getTime() + hours * 36e5))}</text>`
      : '';
    const hover = `<line id="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--ink2)" stroke-width="1" opacity="0"/>` +
                  `<circle id="dot" r="6" fill="var(--accent)" stroke="var(--card)" stroke-width="2" opacity="0"/>` +
                  `<rect id="hit" x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
    box.innerHTML = `<div class="tip" id="tip"></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Laddnivå över tid">${g}${area}${hover}</svg>`;
    chartState = { now, hours, pph, x, y, W, m, iw };
    if (hours > 0) bindHover();
  }

  function bindHover() {
    const svg = $('chart').querySelector('svg'), hit = $('hit');
    const cross = $('cross'), dot = $('dot'), tip = $('tip');
    const move = ev => {
      const pt = ev.touches ? ev.touches[0] : ev;
      const r = svg.getBoundingClientRect();
      const { hours, now, x, y, W, m, iw } = chartState;
      const sx = (pt.clientX - r.left) * (W / r.width);
      const h = Math.min(hours, Math.max(0, (sx - m.l) / iw * Math.max(hours, 1)));
      const p = s.cur + (s.tgt - s.cur) * (h / hours);
      const cx = x(h), cy = y(p);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', .5);
      dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('opacity', 1);
      tip.textContent = `${hm(new Date(now.getTime() + h * 36e5))} · ${Math.round(p)}%`;
      const px = cx * (r.width / W);
      tip.style.left = Math.min(r.width - 50, Math.max(50, px)) + 'px';
      tip.style.top = '-6px';
      tip.style.opacity = 1;
    };
    const leave = () => { cross.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); tip.style.opacity = 0; };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', leave);
    hit.addEventListener('touchmove', move, { passive: true });
    hit.addEventListener('touchend', leave);
  }

  // Events
  $('cur').addEventListener('input', e => { s.cur = +e.target.value; if (s.tgt < s.cur) s.tgt = s.cur; save(); render(); });
  $('tgt').addEventListener('input', e => { s.tgt = +e.target.value; if (s.cur > s.tgt) s.cur = s.tgt; save(); render(); });
  document.querySelectorAll('.step button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.t, v = Math.min(100, Math.max(0, s[k] + +b.dataset.d));
    s[k] = v;
    if (k === 'cur' && s.tgt < s.cur) s.tgt = s.cur;
    if (k === 'tgt' && s.cur > s.tgt) s.cur = s.tgt;
    save(); render();
  }));
  $('wish').addEventListener('input', e => { s.wish = e.target.value || '07:30'; save(); render(); });
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { s.view = b.dataset.view; save(); render(); }));

  const openSheet = o => document.body.classList.toggle('open', o);
  $('openSettings').addEventListener('click', () => openSheet(true));
  $('closeSettings').addEventListener('click', () => openSheet(false));
  $('sheetBg').addEventListener('click', () => openSheet(false));
  $('kw').addEventListener('input', e => { const v = parseFloat(String(e.target.value).replace(',', '.')); if (v > 0) { s.kw = v; save(); render(); } });
  $('bat').addEventListener('input', e => { const v = parseFloat(String(e.target.value).replace(',', '.')); if (v > 0) { s.bat = v; save(); render(); } });
  document.querySelectorAll('#kwChips button').forEach(b => b.addEventListener('click', () => { s.kw = +b.dataset.kw; save(); render(); }));

  const meta = () => { $('meta').textContent = `${nf.format(s.kw)} kW · ${nf.format(s.bat)} kWh batteri`; };
  const full = () => { render(); meta(); };
  window.addEventListener('resize', full);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) full(); });
  setInterval(full, 30000);
  full();
})();
</script>
</body>
</html>
